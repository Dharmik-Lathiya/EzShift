services:
  postgres:
    image: postgres:16-alpine
    container_name: ezshift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ezshift}
      POSTGRES_USER: ${POSTGRES_USER:-ezshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezshift}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ezshift} -d ${POSTGRES_DB:-ezshift}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: